[project]
name = "perception"
version = "0.1.0"
description = "WORLD world service: perception -> structured world events"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "anthropic>=0.40",
    "httpx>=0.27",
    "faster-whisper>=1.0",
    "sounddevice>=0.4.6",
    "python-ulid>=2.2",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["perception"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
